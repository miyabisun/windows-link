name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test the release binary
        shell: pwsh
        run: |
          $env:PORT = "4731"
          $env:WINDOWS_LINK_CONFIG = "$env:RUNNER_TEMP\missing-config.yaml"
          $server = Start-Process -FilePath target\release\windows-link.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4731/healthz).Content -eq "ok`n") { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ok) { throw "server did not answer /healthz" }
            $buttons = Invoke-RestMethod http://127.0.0.1:4731/buttons
            if (@($buttons).Count -ne 0) { throw "expected no buttons without a config" }
          } finally {
            Stop-Process -Id $server.Id -Force
          }
