[package]
name = "windows-link"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Resident Windows server exposing audio, Discord and desktop controls over a local HTTP API"
repository = "https://github.com/miyabisun/windows-link"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_Input_Pointer", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Security", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "0.62"
winvd = "0.0.49"
# winvd takes the HWND type of the windows 0.58 crate.
windows058 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }
ureq = "3"
sha2 = "0.11.0"
png = "0.18.1"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
